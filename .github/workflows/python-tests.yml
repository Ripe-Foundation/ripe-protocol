name: Python tests

on:
  pull_request:
    branches:
      - rh
      - rh-audit-remediation
  merge_group:
    branches:
      - rh
      - rh-audit-remediation
  push:
    # Push runs the full job set -- the same jobs as pull_request and
    # merge_group, not a reduced one.
    #
    # master, rh, and rh-audit-remediation are not push-protected today, and
    # master is not listed on pull_request or merge_group. Push is therefore
    # the only automatic Python validation covering direct integration-branch
    # updates and anything reaching master; PRs targeting master still get no
    # pre-merge merge-ref run.
    #
    # Do not gate the validation jobs off of push again unless both are true:
    # (1) all three branches reject direct pushes, and (2) master is listed on
    # pull_request and merge_group. A unit test cannot see live branch
    # protection -- the YAML routing here is the source of truth.
    #
    # A run on one of these branches is also what makes the Titanoboa cache
    # usable at all: a cache written during a pull_request run is scoped to
    # that pull request, so PRs can never share one. Only a run on the base
    # branch itself writes caches that later PRs targeting it can restore.
    # Restoring a relevant cache measurably beats a cold one (measured on one
    # shard, one input hash: 138s vs 235s).
    branches:
      - master
      - rh
      - rh-audit-remediation
  workflow_dispatch:
    inputs:
      lane:
        description: Test lane to run
        required: true
        default: lean
        type: choice
        options:
          - lean
          - comprehensive

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'automatic' }}
  cancel-in-progress: true

jobs:
  solidity:
    name: Solidity / build and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry 1.3.5
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.3.5

      - name: Build and test CCIP pool source
        run: |
          forge build --root solidity
          forge test --root solidity --offline -vv

  test:
    name: Python 3.12.0 / ${{ matrix.lane }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.lane == 'comprehensive' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.lane == 'comprehensive' && '[{"lane":"comprehensive","shard":"all"}]' || '[{"lane":"lean","shard":"core-a"},{"lane":"lean","shard":"core-b"},{"lane":"lean","shard":"core-teller"},{"lane":"lean","shard":"core-c"},{"lane":"lean","shard":"vaults"},{"lane":"lean","shard":"vaults-gov"},{"lane":"lean","shard":"vaults-modules"},{"lane":"lean","shard":"config"},{"lane":"lean","shard":"price-sources-a"},{"lane":"lean","shard":"price-sources-b"},{"lane":"lean","shard":"supporting"}]') }}
    env:
      # The runner context is not available in jobs.<id>.env — only inside
      # steps — so these use github.workspace, which is.
      ETHERSCAN_API_KEY: local-placeholder
      HYPOTHESIS_STORAGE_DIRECTORY: ${{ github.workspace }}/.ci/hypothesis
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.ci/pycache
      PYTHONHASHSEED: "0"
      RIPE_BOA_CACHE_DIR: ${{ github.workspace }}/.ci/boa
      TMPDIR: ${{ github.workspace }}/.ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/xdg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Python 3.12.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.0"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Titanoboa compiler artifacts
        id: boa-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci/boa
          key: boa-${{ runner.os }}-py312-${{ matrix.lane }}-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            boa-${{ runner.os }}-py312-${{ matrix.lane }}-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-${{ matrix.shard }}-
            boa-${{ runner.os }}-py312-${{ matrix.lane }}-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-
            boa-${{ runner.os }}-py312-${{ matrix.lane }}-
            boa-${{ runner.os }}-py312-

      - name: Create private runtime directories
        run: |
          mkdir -p \
            "$HYPOTHESIS_STORAGE_DIRECTORY" \
            "$PYTHONPYCACHEPREFIX" \
            "$RIPE_BOA_CACHE_DIR" \
            "$TMPDIR" \
            "$XDG_CACHE_HOME" \
            "$RUNNER_TEMP/pytest-cache" \
            "$RUNNER_TEMP/pytest-basetemp"

      - name: Install pinned requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run lean default lane
        if: matrix.lane == 'lean'
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          # Shards are balanced by measured serial runtime rather than test
          # count: tests/core averages ~0.75s per test, tests/vaults ~1.29s, and
          # everything else ~0.65s. Wall clock is the slowest shard, so the
          # heavy directories are split and the light ones are pooled. The
          # matrix-vs-case scheduling equality test in
          # test_lean_shard_coverage.py keeps the shard count honest.
          # loadfile everywhere, no exceptions. It keeps every test in a file on
          # one worker and preserves intra-file ordering.
          #
          # An earlier revision let three shards use --dist load, which spreads a
          # file's tests across workers and roughly halved them locally. That was
          # withdrawn: core-teller then failed intermittently in CI on
          # test_predeployment_valid_ripe_lock_route_preserves_direct_clamp_boundary,
          # where filter_logs saw a TellerDeposit event leaked from another test.
          # The same commit passed as a pull_request run and failed as a push run.
          # The test is long-standing and the PR that surfaced it never touched
          # tests/core/teller, so the distribution change was the cause.
          #
          # It did not reproduce in eight local runs. That is a limitation of the
          # check, not evidence of safety: a 4-vCPU runner interleaves four
          # workers under real contention, which a 32-core machine does not
          # reproduce. Local repetition cannot establish order-independence for
          # CI, so loadfile stays.
          dist_mode=loadfile
          case "$TEST_SHARD" in
            core-a)
              shard_args=(tests/core/endaoment tests/core/deleverage)
              ;;
            core-b)
              shard_args=(tests/core/lootbox tests/core/creditEngine)
              ;;
            core-teller)
              shard_args=(tests/core/teller)
              ;;
            core-c)
              shard_args=(
                tests/core/humanResources
                tests/core/bondRoom
                tests/core/auctionHouse
                tests/core/boardroom
                tests/core/test_stale_vault_replacement.py
                tests/core/test_sc24_gas_matrix.py
              )
              ;;
            vaults)
              shard_args=(
                tests/vaults
                --ignore=tests/vaults/modules
                --ignore=tests/vaults/test_ripe_gov_vault.py
                --ignore=tests/vaults/test_ripe_gov_controls_and_migration.py
                --ignore=tests/vaults/test_ripe_gov_exit_fee.py
              )
              ;;
            vaults-gov)
              shard_args=(
                tests/vaults/test_ripe_gov_vault.py
                tests/vaults/test_ripe_gov_controls_and_migration.py
                tests/vaults/test_ripe_gov_exit_fee.py
              )
              ;;
            vaults-modules)
              shard_args=(tests/vaults/modules)
              ;;
            config)
              shard_args=(tests/config)
              ;;
            price-sources-a)
              shard_args=(tests/priceSources/curve tests/priceSources/blueChip)
              ;;
            price-sources-b)
              shard_args=(
                tests/priceSources
                --ignore=tests/priceSources/curve
                --ignore=tests/priceSources/blueChip
              )
              ;;
            supporting)
              shard_args=(
                tests
                --ignore=tests/core
                --ignore=tests/vaults
                --ignore=tests/config
                --ignore=tests/priceSources
              )
              ;;
            *)
              echo "Unknown lean test shard: $TEST_SHARD"
              exit 2
              ;;
          esac
          # -n 4 matches the 4 vCPUs on a GitHub-hosted ubuntu runner.
          #
          # --dist loadfile is required, not a preference. The default
          # (--dist load) hands individual tests to whichever worker is free,
          # which scatters a single file across workers. Several suites build
          # state in one test that a later test in the same file depends on;
          # serially that order is guaranteed, in parallel it is not. A full-run
          # comparison found nine such failures, all in tests/priceSources, that
          # pass serially. loadfile keeps every test in a file on one worker and
          # restores the ordering guarantee.
          /usr/bin/time -p python -m pytest \
            -n 4 \
            --dist "$dist_mode" \
            -o cache_dir="$RUNNER_TEMP/pytest-cache" \
            --basetemp="$RUNNER_TEMP/pytest-basetemp" \
            --durations=50 \
            "${shard_args[@]}"

      - name: Run comprehensive lane
        if: matrix.lane == 'comprehensive'
        run: |
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          /usr/bin/time -p python -m pytest \
            -o addopts='' \
            -o cache_dir="$RUNNER_TEMP/pytest-cache" \
            --basetemp="$RUNNER_TEMP/pytest-basetemp" \
            --durations=50

      - name: Save Titanoboa compiler artifacts
        if: ${{ always() && steps.boa-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci/boa
          key: ${{ steps.boa-cache.outputs.cache-primary-key }}

  # pytest.ini's addopts ignores tests/deployment, so the lean lane never
  # exercises deploy-path behavior such as the Robinhood execution boundary,
  # verifier input handling, _local_account, and canonical JSON. Those safety
  # controls get their own required job. Static artifact, release, inventory,
  # and approval bindings use the same marker exclusions as the lean lane and
  # remain available through manual comprehensive qualification.
  #
  # It is credential-free: every RPC/key variable is unset, and the suite is
  # offline by construction (its fixtures block sockets and fake submission).
  deployment-controls:
    name: Python 3.12.0 / deployment-controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ETHERSCAN_API_KEY: local-placeholder
      HYPOTHESIS_STORAGE_DIRECTORY: ${{ github.workspace }}/.ci/hypothesis
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.ci/pycache
      PYTHONHASHSEED: "0"
      RIPE_BOA_CACHE_DIR: ${{ github.workspace }}/.ci/boa
      TMPDIR: ${{ github.workspace }}/.ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/xdg
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Python 3.12.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.0"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create private runtime directories
        run: |
          mkdir -p \
            "$HYPOTHESIS_STORAGE_DIRECTORY" \
            "$PYTHONPYCACHEPREFIX" \
            "$RIPE_BOA_CACHE_DIR" \
            "$TMPDIR" \
            "$XDG_CACHE_HOME" \
            "$RUNNER_TEMP/pytest-cache" \
            "$RUNNER_TEMP/pytest-basetemp"

      - name: Install pinned requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run deployment control suites
        run: |
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          unset ETHERSCAN_API_KEY BASESCAN_API_KEY
          # Seven parametrized nodes in test_operator_chain_guards fail
          # identically on pristine origin/rh -- they are rh bugs, invisible
          # there because pytest.ini ignores tests/deployment and the
          # comprehensive lane is manual. Deselected individually rather than by
          # file so the rest of that suite stays in the required gate. Remove
          # each line as rh repairs it.
          #   test_operator_chain_guards -> prepare_defaults has no
          #     _require_robinhood_chain_id / _safe_constant_name
          # The former test_stock_aapl_launch_inclusion deselects are gone: the
          # M2/M3/M4 binding tests they named were deleted with the descoped
          # artifact-expectations pipeline, and the remaining stock-launch tests
          # assert qualification policy rather than source or artifact hashes,
          # so they pass in this gate unmodified.
          /usr/bin/time -p python -m pytest \
            -o addopts='' \
            -o cache_dir="$RUNNER_TEMP/pytest-cache" \
            --basetemp="$RUNNER_TEMP/pytest-basetemp" \
            --durations=25 \
            -m "not release and not artifact and not fuzz and not gas and not fork_qualification" \
            --deselect 'tests/deployment/test_operator_chain_guards.py::test_defaults_snapshot_rejects_every_non_robinhood_mainnet_chain' \
            --deselect 'tests/deployment/test_operator_chain_guards.py::test_defaults_snapshot_accepts_robinhood_mainnet_chain' \
            --deselect 'tests/deployment/test_operator_chain_guards.py::test_defaults_snapshot_sanitizes_untrusted_token_metadata' \
            --deselect 'tests/deployment/test_operator_chain_guards.py::test_defaults_snapshot_preserves_safe_existing_labels' \
            tests/deployment

  snapshot-gas:
    name: Python 3.12.0 / snapshot-gas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETHERSCAN_API_KEY: local-placeholder
      HYPOTHESIS_STORAGE_DIRECTORY: ${{ github.workspace }}/.ci/hypothesis
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.ci/pycache
      PYTHONHASHSEED: "0"
      RIPE_BOA_CACHE_DIR: ${{ github.workspace }}/.ci/boa
      TMPDIR: ${{ github.workspace }}/.ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/xdg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.0"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create private runtime directories
        run: |
          mkdir -p \
            "$HYPOTHESIS_STORAGE_DIRECTORY" \
            "$PYTHONPYCACHEPREFIX" \
            "$RIPE_BOA_CACHE_DIR" \
            "$TMPDIR" \
            "$XDG_CACHE_HOME" \
            "$RUNNER_TEMP/pytest-cache" \
            "$RUNNER_TEMP/pytest-basetemp"

      - name: Install pinned requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Enforce snapshot gas budgets
        run: |
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          /usr/bin/time -p python -m pytest \
            -o addopts='' \
            -o cache_dir="$RUNNER_TEMP/pytest-cache" \
            --basetemp="$RUNNER_TEMP/pytest-basetemp" \
            -m gas \
            tests/priceSources/blueChip/test_bluechip_local.py \
            tests/priceSources/curve/test_robinhood_launch_route.py \
            tests/core/test_sc24_gas_matrix.py

  rh-pr-gate:
    name: rh-pr-gate
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      - test
      - deployment-controls
      - snapshot-gas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful lean lane
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Lean test lane did not succeed: $TEST_RESULT"
            exit 1
          fi

      - name: Require successful deployment controls
        env:
          CONTROLS_RESULT: ${{ needs.deployment-controls.result }}
        run: |
          if [ "$CONTROLS_RESULT" != "success" ]; then
            echo "Deployment control suites did not succeed: $CONTROLS_RESULT"
            exit 1
          fi

      - name: Require successful snapshot gas budgets
        env:
          GAS_RESULT: ${{ needs.snapshot-gas.result }}
        run: |
          if [ "$GAS_RESULT" != "success" ]; then
            echo "Snapshot gas lane did not succeed: $GAS_RESULT"
            exit 1
          fi
