name: Python tests

on:
  pull_request:
  push:
    branches:
      - master
      - rh
  workflow_dispatch:
    inputs:
      lane:
        description: Test lane to run
        required: true
        default: lean
        type: choice
        options:
          - lean
          - comprehensive

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 (${{ inputs.lane || 'lean' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.lane == 'comprehensive' && 120 || 45 }}
    env:
      ETHERSCAN_API_KEY: local-placeholder
      HYPOTHESIS_STORAGE_DIRECTORY: ${{ runner.temp }}/hypothesis
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
      RIPE_BOA_CACHE_DIR: ${{ runner.temp }}/boa
      TMPDIR: ${{ runner.temp }}/tmp
      XDG_CACHE_HOME: ${{ runner.temp }}/xdg
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Titanoboa compiler artifacts
        id: boa-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/boa
          key: boa-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-${{ github.run_id }}
          restore-keys: |
            boa-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-
            boa-${{ runner.os }}-py312-

      - name: Create private runtime directories
        run: |
          mkdir -p \
            "$HYPOTHESIS_STORAGE_DIRECTORY" \
            "$PYTHONPYCACHEPREFIX" \
            "$RIPE_BOA_CACHE_DIR" \
            "$TMPDIR" \
            "$XDG_CACHE_HOME" \
            "$RUNNER_TEMP/pytest-cache"

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Run lean default lane
        if: inputs.lane != 'comprehensive'
        run: |
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          /usr/bin/time -p python -m pytest \
            -o cache_dir="$RUNNER_TEMP/pytest-cache" \
            --durations=50

      - name: Run manual comprehensive lane
        if: inputs.lane == 'comprehensive'
        run: |
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          /usr/bin/time -p python -m pytest \
            -o addopts='' \
            -o cache_dir="$RUNNER_TEMP/pytest-cache" \
            --durations=50

      - name: Save Titanoboa compiler artifacts
        if: ${{ always() && steps.boa-cache.outcome == 'success' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/boa
          key: ${{ steps.boa-cache.outputs.cache-primary-key }}
