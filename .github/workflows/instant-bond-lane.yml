name: Instant Bond Lane

on:
  push:
    branches:
      - instant-bond-lane
  pull_request:
    branches:
      - rh
  merge_group:
    branches:
      - rh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instant-bond-lane-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 feature gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ETHERSCAN_API_KEY: local-placeholder
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.0"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create private runtime directories
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/instant-bond-lane"
          mkdir -p \
            "$runtime_root/basetemp" \
            "$runtime_root/boa" \
            "$runtime_root/hypothesis" \
            "$runtime_root/pycache" \
            "$runtime_root/tmp" \
            "$runtime_root/xdg"
          {
            echo "COVERAGE_FILE=$runtime_root/.coverage"
            echo "HYPOTHESIS_STORAGE_DIRECTORY=$runtime_root/hypothesis"
            echo "PYTHONPYCACHEPREFIX=$runtime_root/pycache"
            echo "RIPE_BOA_CACHE_DIR=$runtime_root/boa"
            echo "TMPDIR=$runtime_root/tmp"
            echo "XDG_CACHE_HOME=$runtime_root/xdg"
          } >> "$GITHUB_ENV"

      - name: Restore Titanoboa compiler artifacts
        id: boa-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/instant-bond-lane/boa
          key: boa-${{ runner.os }}-py312-instant-bond-lane-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-${{ github.run_id }}
          restore-keys: |
            boa-${{ runner.os }}-py312-instant-bond-lane-${{ hashFiles('requirements.txt', 'contracts/**/*.vy', 'interfaces/**/*.vyi') }}-
            boa-${{ runner.os }}-py312-instant-bond-lane-

      - name: Install pinned requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify fail-closed activation draft
        run: python scripts/qualify_instant_bond_lane_activation.py --check-draft

      - name: Verify generated artifacts and source binding
        run: |
          python scripts/export_abis.py --check
          python scripts/simulations/instant_bond_lane_controller.py \
            --check docs/instant-bond-lane/controller-simulation-v2.json

      - name: Run the complete focused feature gate
        shell: bash
        env:
          INSTANT_BOND_FOXTROT_GAS_REPORT: ${{ runner.temp }}/instant-bond-lane/foxtrot-gas.json
          INSTANT_BOND_GAS_REPORT: ${{ runner.temp }}/instant-bond-lane/gas.json
          INSTANT_BOND_SIZE_REPORT: ${{ runner.temp }}/instant-bond-lane/runtime-sizes.json
        run: |
          set -euo pipefail
          unset WEB3_ALCHEMY_API_KEY ALCHEMY_API_KEY ETH_RPC_URL BASE_RPC_URL RPC_URL
          unset WEB3_PROVIDER_URI PRIVATE_KEY MNEMONIC AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          unset RIPE_IBL_RH_FORK_MODE RIPE_IBL_RH_FORK_RPC_URL
          unset RIPE_IBL_RH_FORK_BLOCK_NUMBER RIPE_IBL_RH_FORK_BLOCK_HASH
          unset RIPE_IBL_RH_FORK_MANIFEST RIPE_IBL_RH_FORK_MANIFEST_SHA256
          unset RIPE_IBL_RH_FORK_PAYMENT_TOKEN RIPE_IBL_RH_FORK_PAYMENT_DECIMALS
          unset RIPE_IBL_RH_FORK_EPOCH_LENGTH
          python -m pytest \
            -q \
            -p no:cacheprovider \
            -o addopts='' \
            --basetemp="$RUNNER_TEMP/instant-bond-lane/basetemp" \
            --cov=contracts \
            --cov-branch \
            --cov-config=.coveragerc-instant-bond \
            --cov-report=term-missing \
            --cov-report=json:"$RUNNER_TEMP/instant-bond-lane/coverage.json" \
            tests/core/instantBondLane \
            tests/config/test_switchboard_foxtrot.py \
            tests/deployment/test_instant_bond_lane_activation.py \
            tests/deployment/test_abi_export.py \
            tests/test_instant_bond_lane_workflow.py

      - name: Enforce per-contract coverage and publish evidence
        shell: bash
        run: |
          python scripts/check_instant_bond_lane_coverage.py \
            "$RUNNER_TEMP/instant-bond-lane/coverage.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Save Titanoboa compiler artifacts
        if: ${{ always() && steps.boa-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/instant-bond-lane/boa
          key: ${{ steps.boa-cache.outputs.cache-primary-key }}
