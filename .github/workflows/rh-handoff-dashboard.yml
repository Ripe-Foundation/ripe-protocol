name: Robinhood handoff integrity

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "docs/chains/rh/**"
      - "docs/chains/rh-summary.md"
      - ".github/workflows/rh-handoff-dashboard.yml"
  push:
    branches:
      - rh
    paths:
      - "docs/chains/rh/**"
      - "docs/chains/rh-summary.md"
      - ".github/workflows/rh-handoff-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: rh-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and verify handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/chains/rh/dashboard
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Refresh the integration reference
        run: git fetch --no-tags origin +refs/heads/rh:refs/remotes/origin/rh

      - name: Use the dashboard Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: docs/chains/rh/dashboard/package-lock.json

      - name: Install exact dashboard dependencies
        run: npm ci

      - name: Build and run integrity tests
        run: npm test

      - name: Lint application and build sources
        run: npm run lint
