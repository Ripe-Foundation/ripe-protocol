    additional_elapsed_blocks: 3601
    timestamp: 1755819629
    age_seconds: 117032
  mission_control_global_stale_seconds: 86400
  interpretation: >-
    The fixture's per-feed staleTime is zero, so the direct Chainlink source
    remains nonzero. PriceDesk supplies MissionControl's 86400-second global
    bound. The second timelock crosses it, so Curve feed confirmation fails on
    both target and candidate. Twenty-three assertions fail at confirmation;
    the twenty-fourth is the cascading missing-event assertion.

commands:
  base_green_ref_pool: >-
    /bin/zsh -ic 'source <credential-loader> >/dev/null
    2>&1; exec env PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0
    PYTHONPYCACHEPREFIX=<private-temp> XDG_CACHE_HOME=<private-temp>
    HYPOTHESIS_STORAGE_DIRECTORY=<private-temp>
    RIPE_BOA_CACHE_DIR=<private-temp>
    <python-env>/bin/python
    -m pytest -q -p no:cacheprovider --basetemp=<private-temp> --fork base
    --anvil --junitxml=<evidence>/base-green-ref-pool-junit.xml
    tests/priceSources/curve/test_green_ref_pool.py'
  candidate_asset_lp: >-
    Same credential and isolated-cache wrapper, with --fork base --anvil
    --junitxml=<evidence>/base-curve-prices-candidate-junit.xml
    tests/priceSources/curve/test_curve_prices.py at candidate_test_commit. The
    test-only harness advances governance NUMBER while holding fork timestamp
    fixed so historical oracle age and timelock progress are independent.
  target_asset_lp: >-
    Same credential and isolated-cache wrapper, with --fork base --anvil
    --junitxml=<evidence>/base-curve-prices-target-junit.xml
    tests/priceSources/curve/test_curve_prices.py in a detached worktree at
    remediation_base_commit.
  price_desk_curve_composition: >-
    python -m pytest -o addopts='' -q -s -p no:cacheprovider
    --basetemp=<private-temp>
    --junitxml=<evidence>/pricedesk-curve-composition-junit.xml
    tests/priceSources/curve/test_robinhood_launch_route.py, in a detached
    candidate worktree whose PriceDesk.vy is restored from price_desk_commit.
  robinhood_clock_capture: >-
    python scripts/capture_robinhood_curve_clock.py
    --rpc-url https://rpc.mainnet.chain.robinhood.com --sample-size 16
    --end-block 37417709
  fail_first_prepare: >-
    Create a detached worktree at unfixed_commit; restore
    tests/priceSources/curve/test_green_ref_pool.py,
    contracts/mock/MockCurveRefPool.vy, and
    contracts/mock/MockCurveRefPoolRegistry.vy from candidate_test_commit;
    apply fail-first-overlay.patch. Resulting test-file SHA-256 is
    e6ebc2eeb1edee3e954e392cd5439da70d91ba474e518139fa5a34defb41a1b5.
  fail_first_execute: >-
    python -m pytest -q --tb=short -p no:cacheprovider
    --basetemp=<private-temp>
    --junitxml=<evidence>/fail-first-4a72a1f-junit.xml
    tests/priceSources/curve/test_green_ref_pool.py::test_sc16_single_safe_snapshot_preserves_danger_history
    tests/priceSources/curve/test_green_ref_pool.py::test_sc23_fully_stale_status_returns_zero
    tests/priceSources/curve/test_green_ref_pool.py::test_capacity_regrowth_cannot_resurrect_discarded_slots
    tests/priceSources/curve/test_green_ref_pool.py::test_extreme_stale_blocks_rejected_without_poisoning_view

