repository_ci:
  observed_at: 2026-08-08
  workflow: .github/workflows/python-tests.yml
  triggers: [pull_request, "push:master", "push:rh", workflow_dispatch]
  default_lane: lean
  prior_state: >
    Until 8 August 2026 this workflow declared only workflow_dispatch and was
    additionally invalid: its job-level environment block referenced the runner
    context, which exists only inside steps. GitHub reported that as a failed
    run carrying no jobs and no annotations on every push, so the suite had
    never run on a pull request and would have failed even by manual dispatch.
    No automated test signal existed for the repository.
  current_state: >
    The context error is fixed and the workflow runs the lean lane on every pull
    request and on pushes to master and rh. The deployment-controls job retains
    deploy-path behavior and security checks while applying the same release and
    artifact marker exclusions as the lean lane. Manual comprehensive dispatch
    clears those exclusions for deferred qualification.
  known_red: >
    The deferred manual artifact/release lane is red against the frozen artifact
    baseline and drifts further with every merged contract change, because those
    tests compare committed source and ABI hashes to the current tree. This is
    expected and carries no information: the release procedure regenerates the
    baseline wholesale and diffs it against the merged contract history, so the
    stale nodes are discarded rather than repaired. Note that hash staleness
    also makes the pipeline's tamper-detection tests vacuous while it persists
    -- they short-circuit on the source hash before reaching the field they
    exercise -- so a green artifact lane is a precondition for those proofs to
    mean anything. No count is recorded here on purpose: an enumeration of red
    nodes goes stale faster than it can be maintained, which is the same failure
    this policy exists to remove. Run the lane to see the current state:
    python -m pytest -o addopts='' -m artifact

  interpretation: >
    Enabling CI made an existing red state visible; it did not create it. A
    first green build requires the inherited failures to be addressed on their
    own merits.

