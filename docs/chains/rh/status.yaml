sc12_activation_state:
  source: docs/chains/rh/smart-contract-changes/ripe-gov.md
  underscore_forced_release:
    state: blocked_before_nonzero_registry_configuration
    accepted: false
    tracked_issue: https://github.com/Ripe-Foundation/ripe-protocol/issues/161
    current_containment: DefaultsRobinhoodLive.underscoreRegistry returns the zero address, so registered Underscore and Lego authorization is dormant.
    risk: A registered Underscore address or Lego is accepted without a caller-to-user relationship and may force an unrelated user's early release through an exposed Teller call; a pool shareholder can receive part of the victim's redistributed fee.
    activation_rule: A nonzero Underscore registry must not be configured until authorization is bound to the actual wallet/user relationship with negative unrelated-Lego tests, or the owner and security reviewers explicitly accept the exact registered contracts, callable surfaces, monitoring, and incident controls.
    scope_boundary: PR 144 records and gates this pre-existing Teller and TellerUtils behavior but does not redesign it or accept the risk.
  ripe_gov_nonreentrancy:
    state: reviewed_no_action
    rationale: RipeGov adjustLock and releaseLock accept only the exact Teller; both Teller routes are nonreentrant, and Boardroom or Lootbox callbacks cannot call RipeGov as Teller.
    future_change_rule: A defense-in-depth RipeGov decorator requires separate authorization plus runtime-size, artifact-identity, callback, and full-regression validation.

