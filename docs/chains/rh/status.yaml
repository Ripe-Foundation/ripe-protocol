  - { order: 2, label: "Maintain source and derived-ledger consistency", internal_reference: "H-04 / S6", plain_language_scope: "Edit Blueprint and DefaultsRobinhood directly, then synchronize and check the derived evidence ledger.", why_it_matters: "The JSON ledger must never become an alternate product-value authority.", detail: "Require deterministic sync, read-only check mode, exact ownership, compilation, parity, and configuration-consistency review.", state: "active", owner_gate: "H-04 owner and independent reviewers"}
  - { order: 3, label: "Promote deterministic planning to release-candidate readiness", internal_reference: "H-05 planning", plain_language_scope: "Rebuild deterministic reports after binding while preserving blocked, omitted, assertion-only, and executable distinctions.", why_it_matters: "Integrated planning code must not turn absent values or reservations into transactions.", detail: "No Robinhood migration history exists; plan execution remains a later separately authorized gate.", state: "gated", owner_gate: "H-05, protocol, security, and release reviewers"}
  - { order: 4, label: "Bind the final manifest operator and storage", internal_reference: "H-06 qualification", plain_language_scope: "Bind the qualified macOS/APFS class to the intended operator machine, selected volume, and frozen release candidate.", why_it_matters: "Candidate class qualification is not final machine, volume, publication, deployment, or release authorization.", detail: "Preserve the case-sensitive history residual and keep Linux unsupported and fail-closed.", state: "gated", owner_gate: "H-06 operations, security, and release reviewers"}
  - { order: 5, label: "Freeze configuration without activating Stock", internal_reference: "M5", plain_language_scope: "Register, configure, verify, and freeze the Stock route while retaining the disabled and unreachable posture.", why_it_matters: "Integrated M1-M4 proof does not select production values or authorize reachability.", detail: "Begin only after parameter, oracle, SecOps, deployment, and release prerequisites close.", state: "gated", owner_gate: "Track 8, H-04, oracle, SecOps, and release owners"}
  - { order: 6, label: "Complete verification and artifact readiness", internal_reference: "H-07", plain_language_scope: "Freeze exact verifier adapters, ABI exports, runtime artifacts, and offline proof inputs without live submission.", why_it_matters: "Rehearsal requires exact artifacts and reproducible checks rather than generated output trusted by convention.", detail: "Keep RPC, account, signer, deployment, and verification submission outside this predeployment phase.", state: "gated", owner_gate: "H-07, protocol, security, and independent reviewers"}
  - { order: 7, label: "Prove topology and archive-fork behavior", internal_reference: "H-08 / H-09", plain_language_scope: "Verify topology, negative reachability, reproducibility, adversarial behavior, safe-default collection, opt-in read-only archive qualification, and clean teardown/replay.", why_it_matters: "Deployment is not trustworthy until independent checks prove both required connections and forbidden routes against exact identities.", detail: "H-09 remains network-disabled by default; reseal its ceiling without Deleverage unless explicitly reopened.", state: "not_started", owner_gate: "QA, security, deployment, H-09, and protocol owners"}
  - { order: 8, label: "Complete SecOps handoff, H-10 rehearsal, and release gates", internal_reference: "SecOps / H-10 / H-11", plain_language_scope: "Freeze authorities, monitoring, signer policy, operational ownership, live-rehearsal evidence, and restricted-release approval.", why_it_matters: "Integrated software cannot operate safely without accountable authority transfer, monitoring, incident controls, and explicit approval.", detail: "H-09 read-only qualification grants no H-10 authority; testnet, production, activation, and release each need separate exact authority.", state: "not_started", owner_gate: "SecOps, operations, governance, security, and release owner"}

workstreams:
  - id: S1
    name: Dual-clock test foundation
    group: Shared clock safety
    plain_language_scope: Model block-number and timestamp behavior independently so repeated and jumping identities can be tested safely.
    why_it_matters: Clock-domain confusion can invalidate cooldown, timelock, liquidation, and accounting behavior across the shared protocol.
    current_phase: integrated foundation
    implementation_state: integrated
    integration_state: integrated
    review_state: reviewed
    owner_decision_state: approved
    remaining_blockers: [Downstream H-04 binding, H-08, and H-09 consumption.]
    deployment_release_state: not deployed; release gates open
    exact_next_action: Consume the integrated M4 proof in H-08/H-09 assertions without changing clock semantics.
    authority: Integrated rh source, tests, and evidence.
    docs: [{ label: Removed - S1 brief, path: docs/simplification/REMOVED.md }]
  - id: S2
    name: Checked block-clock inventory
    group: Shared clock safety
    plain_language_scope: Keep every production block-number occurrence classified, pinned, and mutation-checked against current integrated source.
    why_it_matters: Unreviewed clock use can reintroduce a Robinhood safety failure even when focused feature tests pass.
    current_phase: removed from the active tree
    implementation_state: removed; checker, ledger, and its 180 tests deleted
    integration_state: removed
    review_state: superseded; the inventory pinned an exact repository file census rather than contract behaviour
    owner_decision_state: >
      Removed under the codebase-simplification branch. The owner accepted on
      2026-08-08 that production clock usage is no longer scanned. This is an
      accepted coverage loss, not an oversight.
    coverage_accepted_as_lost: >
      The inventory scanned production sources for block.number and
      block.timestamp usage, mixed-clock arithmetic, and unclassified Vyper
      paths. Nothing replaces it. A new production timestamp occurrence, a moved
      occurrence, or a new unclassified path can now enter with no scanner
      objecting. Clock-affecting changes are reviewed on their own merits.
    remaining_blockers: [None. The scanning obligation was retired, not deferred.]
    deployment_release_state: not deployment evidence; no longer produced
    exact_next_action: None. Occurrence, line, and file counts are no longer enforced by any test.
    authority: git history; see docs/simplification/REMOVED.md
    docs: [{ label: Removed paths, path: docs/simplification/REMOVED.md }]
  - id: S3
    name: Lootbox immutable floor
    group: Shared clock safety
    plain_language_scope: Set a per-deployment immutable action floor while preserving strict greater-than behavior and shared compatibility.
    why_it_matters: Robinhood cadence needs an explicit floor without generalizing one conversion rule to unrelated economics.
    current_phase: integrated implementation
    implementation_state: integrated
    integration_state: integrated
    review_state: reviewed
    owner_decision_state: approved (Base 43,200; Robinhood 7,200)
    remaining_blockers: [H-04 deployment binding and H-09 proof.]
    deployment_release_state: not deployed on Robinhood
    exact_next_action: Bind the floor through H-04 and prove it in H-09 without altering history.
    authority: Integrated implementation record and source.
    docs: [{ label: S3 record, path: docs/chains/rh/lootbox-floor-implementation-record.md }]
