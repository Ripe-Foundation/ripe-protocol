glossary:
  - { term: CCIP, meaning: "Chainlink Cross-Chain Interoperability Protocol; GREEN/RIPE topology is live, while operational policy, destination-gas evidence, exact source/compiler/constructor identity, license and transaction provenance, live-send tooling, further transactions, and release remain gated."}
  - { term: PSM, meaning: "Peg Stability Module for reserve minting and redemption; its parameters and activation are outside the current production candidate and the existing capability remains disabled."}
  - { term: CLI, meaning: "Command-line interface used to select a network and prepare actions; profiles do not authorize live use."}
  - { term: ArbSys at 0x64, meaning: "Robinhood system contract used by the portable Ledger to read child-block identity."}
  - { term: EIP-170, meaning: "Ethereum deployed-contract size limit that constrained the integrated M1 Teller change."}
  - { term: Phase A, meaning: "Evidence and decisions for an exact boundary; it does not authorize implementation unless separately stated."}
  - { term: Phase B, meaning: "Separately authorized implementation on an exact baseline and file ceiling; H-04 schema v2 is integrated, the H-05 imperative migration candidate remains under repository review, the former declarative planner is retired, and execution remains gated."}
  - { term: Gate 1, meaning: "Independent review of a completed implementation candidate and its validation evidence."}
  - { term: Gate 2, meaning: "Independent final merge-readiness review of the exact reconciled candidate."}
  - { term: Stage C, meaning: "Post-Gate-1 checked inventory and planning-document reconciliation; it is not implementation validation."}

