    why_it_matters: A bridge controls direct mint authority and cross-chain supply; examples or recovery paths are insufficient.
    current_phase: live topology confirmed; operational readiness incomplete
    implementation_state: token-specific live 1.5.1 pools observed; repository vendored source exists, but exact source/compiler/constructor binding is unproven
    integration_state: registered, routed, reciprocally wired, governance-owned, and mint-enabled
    review_state: current topology reconciled; remaining operational evidence explicit
    owner_decision_state: rate-limit and rateLimitAdmin disposition required
    remaining_blockers: [Full real-token OffRamp destination-gas evidence, live transaction backend, exact live source/compiler/constructor identity, license and legal conclusions, exact historical setPool/applyChainUpdates provenance if required, further transaction and release authority.]
    deployment_release_state: existing topology live; no additional transaction or release authorized
    exact_next_action: Resolve explicit policy and evidence gates; do not infer or apply defaults.
    authority: CCIP live-state document and 2026-08-11 onchain evidence snapshot.
    docs: [{ label: CCIP live state, path: docs/chains/rh/ccip-live-state.md }, { label: Historical CCIP decision, path: docs/chains/rh/ccip-integration-decision.md }]
  - id: SecOps
    name: Security operations handoff
    group: Operations
    plain_language_scope: Freeze signers, authorities, roles, monitoring, escalation, kill procedures, and accountable ownership.
    why_it_matters: Deployment without authority and incident-response handoff leaves privileged capabilities unsafe or unowned.
    current_phase: outstanding
    implementation_state: not started
    integration_state: not integrated
    review_state: not started
    owner_decision_state: open
    remaining_blockers: [B-SECOPS-HANDOFF, H-04 roles, signer policy, monitoring and operations approvals.]
    deployment_release_state: blocks testnet, production, activation, and release
    exact_next_action: Produce the authority and monitoring handoff after configuration and plan identities are frozen.
    authority: H-03 blocker registry and deployment specification.
    docs: [{ label: Removed - Blueprint evidence, path: docs/simplification/REMOVED.md }]
  - id: Deployment
    name: Robinhood deployment
    group: External state
    plain_language_scope: Execute an approved immutable plan only after every artifact, parameter, role, verification, and operator gate closes.
    why_it_matters: Deployment creates persistent external state and cannot be inferred from integrated source or local validation.
    current_phase: unauthorized
    implementation_state: no deployment executed
    integration_state: not applicable
    review_state: deployment package does not exist
    owner_decision_state: no testnet or production authority
    remaining_blockers: [H-04 through H-11, M5, SecOps, all H-03 blockers, external-action authority.]
    deployment_release_state: nothing deployed
    exact_next_action: Do not deploy; complete the critical path and obtain exact external-action authority.
    authority: Explicit program authorization boundary.
    docs: [{ label: Validation plan, path: docs/chains/rh/robinhood-deployment-validation-plan.md }]
  - id: Release
    name: Restricted Robinhood release
    group: External state
    plain_language_scope: Approve activation only after testnet evidence, production preflight, SecOps, monitoring, controls, and final review.
    why_it_matters: Integration, configuration, or deployment does not prove users and assets can be exposed safely.
    current_phase: unauthorized
    implementation_state: no release package completed
    integration_state: not applicable
    review_state: release readiness not established
    owner_decision_state: release not approved
    remaining_blockers: [M5, H-08, H-09, H-10, H-11, SecOps, deployment verification.]
    deployment_release_state: no activation or release
    exact_next_action: Keep every route inactive and await independent release review after all gates close.
    authority: Explicit program authorization boundary.
    docs: [{ label: Support specification, path: docs/chains/rh/robinhood-deployment-support-specification.md }]

decisions:
  - { id: RH-D001, title: "Minimum production-contract change", status: "approved_controlling", summary: "Prefer unchanged source, configuration, omission, disabled state, accepted residual, then the smallest shared change.", source: "docs/chains/rh/minimal-contract-change-reassessment.md"}
  - { id: RH-D002, title: "One canonical shared source line", status: "approved_controlling", summary: "Keep one shared source line; DefaultsRobinhood cannot contain divergent protocol logic.", source: "docs/chains/rh-summary.md"}
  - { id: RH-D003, title: "Chain-local protocol and limited bridging", status: "approved_controlling", summary: "Positions and governance remain chain-local; only GREEN and RIPE are bridge candidates.", source: "docs/chains/rh-summary.md"}
  - { id: RH-D004, title: "AAPL is the only initial Stock Token", status: "approved", summary: "Every later Stock Token needs its own complete evidence and approval package.", source: "docs/chains/rh/track-8-m0-owner-decision-packet.md"}
  - { id: RH-D005, title: "Stock routes remain unreachable until containment closes", status: "approved_routes_disabled", summary: "M1-M4 proof is integrated; Stock remains disabled through M5, audit, configuration, deployment, and release.", source: "docs/chains/rh/track-8-m0-owner-decision-packet.md"}
  - { id: RH-D006, title: "Exact receipt on every Teller deposit route", status: "implementation_integrated", summary: "M1 exact receipt is integrated but does not activate Stock.", source: "docs/chains/rh/evidence/stock-token-m1-exact-receipt.md"}
  - { id: RH-D007, title: "Chain-native sGREEN, never bridged", status: "approved", summary: "sGREEN is chain-native and never receives a CCIP route.", source: "docs/chains/rh/track-8-m0-owner-decision-packet.md"}
  - { id: RH-D008, title: "CCIP complete or disabled", status: "superseded_by_confirmed_live_state", summary: "The historical disabled posture was overtaken by live activation. Current topology is confirmed; explicit rate policy, destination-gas evidence, exact source/compiler/constructor identity, license and transaction provenance, live-send backend, further transaction authority, and release gates remain open.", source: "docs/chains/rh/ccip-live-state.md"}
  - { id: RH-D009, title: "USDG price path", status: "price_path_approved_activation_gated", summary: "Use the shared official feed path; PSM deployment and activation remain separate gates.", source: "docs/chains/rh/usdg-psm-decision.md"}
  - { id: RH-D010, title: "Lootbox immutable floor", status: "approved_reviewed_integrated", summary: "Base uses 43,200 and Robinhood 7,200 with strict greater-than behavior.", source: "docs/chains/rh/lootbox-floor-implementation-record.md"}
  - { id: RH-D011, title: "Deleverage initial no-code posture", status: "zero_cooldown_closed_bounded_rh_d028_and_rh_d038_exceptions", summary: "Zero cooldown, omitted Underscore, and four deferred controls remain closed. RH-D028 narrowly reopens its custody-shortfall candidate and RH-D038 separately reopens only draft PR #145's SC-07/SC-09 remediation; all broader Deleverage work stays parked.", source: "docs/chains/rh/deleverage-cooldown-security-decision.md"}
  - { id: RH-D012, title: "Portable Ledger child-block identity", status: "implementation_integrated", summary: "Ledger implementation is integrated; downstream binding, deployment proof, and release remain open.", source: "docs/chains/rh/ledger-guard-implementation-record.md"}
  - { id: RH-D013, title: "Typed network profiles", status: "approved_reviewed_integrated", summary: "Use the immutable identity-first profile registry with secret-safe fail-closed behavior.", source: "docs/chains/rh/track-7-h2-network-profiles-cli.md"}
  - { id: RH-D014, title: "Symbolic blueprint before concrete values", status: "implementation_integrated_blockers_open", summary: "H-03 implementation is integrated; all 28 canonical H-03 blockers, including nine Curve launch inputs, remain open and grant no deployment authority.", source: "docs/chains/rh/evidence/robinhood-blueprint-phase-a.md"}
  - { id: RH-D015, title: "One combined defaults and parameter workstream", status: "source_authority_integrated_bindings_open", summary: "Blueprint and DefaultsRobinhood are the two value authorities and the v4 ledger is derived. Configuration consistency passes; unverified external facts and deployment-produced identities keep deployment readiness fail-closed while Deleverage is parked.", source: "docs/chains/rh/evidence/robinhood-defaults-parameters-phase-a.md"}
  - { id: RH-D016, title: "Shared migration source, isolated histories", status: "imperative_candidate_review_execution_unauthorized", summary: "The current eight-file imperative Robinhood migration candidate is under draft PR #73 review; no executable plan is authorized or censused, no Robinhood history exists, and execution remains unauthorized.", source: "docs/chains/rh/rh-production-vyper-remediation.md"}
  - { id: RH-D017, title: "Immutable manifest and evidence chain", status: "candidate_class_qualified_final_binding_open", summary: "H-06 qualifies a macOS/APFS operator/storage class only; final machine/volume, deployment, promotion, and release remain unauthorized.", source: "docs/chains/rh/evidence/robinhood-manifest-macos-release-qualification.md"}
  - { id: RH-D018, title: "Dashboard tooling is separate from launch dependencies", status: "approved_placement_clause_superseded_by_rh_d024", summary: "Dashboard tooling remains outside H-01 and cannot affect its disposition. Its repository-placement and path-scoped-CI clauses are superseded by RH-D024.", source: "docs/chains/rh/decision-register.md", source_availability: "private_handoff"}
  - { id: RH-D019, title: "Private dashboard is a temporary presentation mirror", status: "approved_temporary", summary: "The private mirror is optional; repository documents remain complete authority and fallback.", source: "docs/chains/rh/decision-register.md", source_availability: "private_handoff"}
  - { id: RH-D024, title: "The dashboard is extracted from the active tree", status: "approved_extraction", summary: "The dashboard application and its workflow are removed from the active tree and recoverable from 610b43f4508e85628a1362532a79d68d71ea902c; this supersedes the RH-D018 placement clause and leaves the RH-D019 publication posture parked.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D020, title: "Consolidated Profile 1 launch and Profile 2 follow-on", status: "approved_superseded_for_curve_topology", summary: "Preserve Ledger, Teller, and separate Stock-specific Guarded architecture. RH-D021 supersedes only the earlier empty-ID-2 and all-Curve-in-Profile-2 boundary; the remaining H-09/H-10 lifecycle separation continues.", source: "docs/chains/rh/reassessment-and-qualification-synthesis.md"}
  - { id: RH-D021, title: "Bounded Curve launch pricing", status: "approved_candidate_implementation_blocked_for_deployment", summary: "Select unchanged CurvePrices at PriceDesk ID 2 for GREEN only, configure priorities [1,2], keep USDG Chainlink-only and IDs 4/5 empty, and keep blueprint-selected ID 3 undeployed by the current candidate. Exclude LP admission, additional feeds or consumers, dynamic rates, Teller snapshots, Endaoment stabilization, PSM Curve use, and Uniswap. Sixty-four unresolved or unverified bindings keep deployment readiness false.", source: "docs/chains/rh/rh-production-vyper-remediation.md"}
  - { id: RH-D022, title: "RIPE reward launch product decision approved; operations open", status: "approved_product_decision_operationally_blocked", summary: "Current source assigns 1,000,000e18 RIPE to rewards, 0 to HR, and 1,000,000e18 to bonds while retaining the approved rewards configuration. Operational prerequisites remain open, Stock rewards remain disabled, and no lifecycle authority is granted.", source: "docs/chains/rh/rh-production-vyper-remediation.md"}
  - { id: RH-D023, title: "LP launch admission reconsidered independently", status: "qualified_no_protocol_admission", summary: "Fresh per-LP source-path qualification preserves the selected GREEN/USDG launch-pricing pool but excludes its LP token; RIPE/WETH remains external-canary-only, both protocol admissions and all DP-14 leaves remain blocked, and no lifecycle authority is granted.", source: "docs/chains/rh/qualification/lp-launch-admission.md"}
  - { id: RH-D025, title: "Production clock usage is no longer scanned", status: "owner_accepted_coverage_loss", summary: "The block-clock inventory, its checker, and its tests are removed and nothing replaces them. Production block.number and block.timestamp usage, mixed-clock arithmetic, and unclassified Vyper paths are no longer scanned; clock-affecting changes are reviewed on their own merits. Reopen if a clock-related defect reaches a deployment candidate or a second chain with a divergent block clock is added.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D026, title: "CreditEngine carries an exact headroom waiver at 184 bytes", status: "retired_default_floor_restored", summary: "The exact prior-version waiver reopened when CreditEngine changed. The new constructor-bound runtime is 24,367 bytes with 209 bytes of EIP-170 headroom, so its override and pinned waiver identity are removed and the default 200-byte floor applies. No new below-floor waiver was granted.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D027, title: "Teller carries an exact migration and receipt-guard waiver at 71 bytes", status: "retired_candidate_local_default_floor_restored", summary: "The RH-D028 candidate changes Teller by removing the singular deleverageUser API and deploys at 24,218 bytes with 358 bytes of headroom. The prior 71-byte exact waiver self-retires, and its override and identity are removed. This retirement remains candidate-local until the package is committed and integrated.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D028, title: "BasicVault custody-shortfall quarantine is account-scoped", status: "owner_accepted_candidate_revised_by_b_aud_008", summary: "The exact B-AUD-008 candidate derives quarantine from positive LTV, zero backing-aware user amount, a nominal user-balance bit, and zero backing-aware vault total. Account-wide borrowing, positive-LTV withdrawal, liquidation, redemption, and forced-deleveraging suppression is accepted while repayment, unrelated healthy deposits, governance swapCollateral, truthful type-1 reporting, and automatic custody recovery remain. BasicVault suppresses each affected user's current Lootbox share without mutating nominal balances, configured fixed allocations, or prior points; future user balance-point accrual resumes without catch-up after custody restoration. No deployment or release authority is granted.", source: "docs/chains/rh/evidence/basic-vault-reward-suppression-waiver.md"}
  - { id: RH-D029, title: "CreditEngine carries an exact combined waiver at 10 bytes", status: "owner_granted_replacement_exact_zero_growth_waiver", summary: "The 200-byte floor remains controlling. For the exact combined B-AUD-008, B-OBS-045 / AUD-010, and CreditRedeem price-isolation artifact, CreditEngine deploys at 24,566 bytes including immutables, leaving 10 bytes. The owner accepted that technically deployable margin; source, runtime template, exact deployed size, and a deterministic immutable-bound deployed hash are pinned, and the replacement waiver permits zero growth and reopens on any source or compiler-output change.", source: "docs/chains/rh/evidence/basic-vault-reward-suppression-waiver.md"}
  - { id: RH-D030, title: "SwitchboardAlpha carries a replacement exact waiver at 108 bytes", status: "owner_granted_replacement_exact_zero_growth_waiver", summary: "The prior 2-byte identity reopened when SwitchboardAlpha changed. The exact trimmed artifact preserves priority-vault validation while removing the single-consumer MissionControl flags getter and deploying at 24,468 bytes including seven immutable words, leaving 108 bytes. The owner accepted that technically deployable margin; source, runtime template, exact deployed size, and a deterministic immutable-bound deployed hash are pinned, and the replacement waiver permits zero growth and reopens on any source or compiler-output change.", source: "docs/chains/rh/evidence/switchboard-alpha-headroom-waiver.md"}
  - { id: RH-D031, title: "Teller carries an exact third-party-touch waiver at 20 bytes", status: "historical_exact_waiver_replaced_by_rh_d032", summary: "RH-D031 remains the historical authority for the exact Teller third-party-touch artifact identified in its register entry. The later minimum-payout source changed Teller and reopened that exact waiver; RH-D031 does not authorize the current source or compiler output.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D032, title: "Teller bond minimum-payout protection exact waiver at 20 bytes", status: "owner_granted_exact_zero_growth_waiver", summary: "RH-D032 controls the current Teller minimum-payout artifact at 24,556 deployed bytes and 20 bytes of headroom. It pins the exact source, ABI/selectors, creation artifacts, runtime template, constructor-bound deployed hashes, and zero-growth reopening conditions. The one-argument purchaseRipeBond selector is removed and release conditions remain binding; this decision does not authorize deployment, registry mutation, activation, or release.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D033, title: "BlueChip SC-05/SC-17/SC-23 uses the codesize optimizer", status: "owner_approved_candidate_compiler_profile", summary: "The owner selected Vyper codesize after independent comparison: +255 gas on each of three measured top-level paths saves 1,076 deployed bytes versus gas optimization. The candidate deploys at 22,739 bytes with 1,837 bytes of EIP-170 headroom, so the ordinary 200-byte floor applies and no waiver is granted. RH-D034 separately accepts the SC-17 residual; this compiler decision does not authorize deployment or activation.", source: "docs/chains/rh/evidence/yield-price-snapshot-remediation.md"}
  - { id: RH-D034, title: "SC-17 timing residual is conditionally accepted", status: "owner_conditionally_accepted_candidate_residual", summary: "The owner accepted retaining observation-interval TWAP with its documented snapshot-timing residual. Every snapshot-backed feed remains inactive until it has finite nonzero freshness, minSnapshotDelay no greater than staleTime, vault-specific downward-PPS manipulation qualification, monitored honest refresh before expiry, and tested alert/pause/disable procedures. Undy and all deployment, registration, activation, release, vault, and exact-parameter decisions remain separately gated.", source: "docs/chains/rh/evidence/yield-price-snapshot-remediation.md"}
  - { id: RH-D035, title: "RipeGov early-release redistribution and governance-point lifecycle", status: "owner_accepted_sc12_candidate_complete_underscore_activation_blocked", summary: "SC-12 keeps the fee in-pool and retains the maximal indivisible share balance under the exact post-state claim bound. Address-level common-owner recapture and the governance-point lifecycle remain accepted policy. The pre-existing registered Underscore or Lego caller path is not user-bound and is not accepted: issue #161 blocks any nonzero Underscore registry until user-bound authorization is proven or exact owner/security acceptance is recorded. RipeGov-local nonreentrancy is reviewed with no action because exact-Teller access is protected by Teller's nonreentrant routes. Base rebind issue #150, integration, deployment, activation, governance-power use, migration, and release remain separate gates.", source: "docs/chains/rh/smart-contract-changes/ripe-gov.md"}
  - { id: RH-D036, title: "AuctionHouse conservation exact waiver at 22 bytes", status: "owner_granted_exact_zero_growth_waiver", summary: "The 200-byte floor remains controlling. For the exact SC-01, SC-02, and SC-08 conservation artifact, AuctionHouse deploys at 24,554 bytes including 96 immutable bytes, leaving 22 bytes. The owner accepted that technically deployable margin and the explicit SC-08 policy: the Stability spread is a legacy discount rate, an empty first pass permanently waives episode fees, and fee-free retry liveness depends on a bound protocol-operated monitor or keeper. Source, runtime template, exact deployed size, and deterministic immutable-bound deployed hashes are pinned. The waiver permits zero growth and reopens on any source, compiler, dependency, constructor-input, or compiler-output change; it does not authorize deployment or activation.", source: "docs/chains/rh/decision-register.md"}
  - { id: RH-D038, title: "SC-07/SC-09 Deleverage remediation is reopened and bounded", status: "owner_authorized_draft_pr_145_candidate", summary: "The owner reopened only the exact SC-07 stale-settlement and SC-09 optional Stability Pool availability remediation in draft PR #145. Broad and withdrawal-assist probes skip unavailable cohorts while direct and processing-time paths remain fail-closed. The final 24,309-byte deployed runtime leaves 267 bytes and uses the ordinary 200-byte floor without a waiver; all cooldown, Underscore, deferred-control, fork, deployment, configuration, activation, and release work remains parked.", source: "docs/chains/rh/deleverage-sc07-sc09-security-decision.md"}
  - { id: RH-D043, title: "Curve snapshot remediation uses confirmation-anchored continuity", status: "owner_accepted_ancestor_clock_review_ready_activation_blocked", summary: "The owner accepted native block.number on Robinhood as repeating/jumping ancestor-block progression, with the recorded 7200-stale/720-cadence calibration, for the reviewed Curve source. The exact-source SHA-256 condition was retired on 2026-08-16: the artifact.curve_prices_source_sha256 and artifact.curve_prices_abi_sha256 launch inputs, the RH_CURVE_ARTIFACT_DRIFT validator, and the generator's real-file hashing were removed because they failed unrelated pull requests on any legitimate Curve edit. Semantic Curve configuration, recursion, permission, route, and deployment-policy checks are controlling; a future Curve source change will no longer flag that a different artifact was approved. Duration-weighted danger and confirmation-anchored classification/freshness transitions are accepted; GREEN reference snapshots and dynamic rates remain inactive pending separate deployment and activation authority.", source: "docs/chains/rh/evidence/curve-snapshot-remediation.md"}

deadlines:
  - { id: H01-EXCEPTION-REVIEW, label: "Review both retained dependency-security exceptions", due_at: "2026-08-15", kind: "scheduled_review", plain_language_scope: "Re-review pytest and Pymdown b64 reachability, controls, ownership, and retirement paths.", why_it_matters: "A dated exception becomes stale if its facts and controls are not revalidated.", owner: "H-01 owner and independent security reviewer", consequence: "Missing review blocks affected exception use for rehearsal.", source: "docs/chains/rh/evidence/dependency-security-gate.md"}
  - { id: H01-EXCEPTION-EXPIRY, label: "Retire or explicitly replace both remaining exceptions", due_at: "2026-08-31T23:59:59Z", kind: "hard_expiry", plain_language_scope: "Retire each exception or replace it through a new explicitly authorized security decision.", why_it_matters: "Existing exception authority ends at expiry and cannot continue by inertia.", owner: "H-01 owner and independent security reviewer", consequence: "Expiry blocks rehearsal and merge until valid authority exists.", source: "docs/chains/rh/evidence/dependency-security-gate.md"}

hard_gates:
  - { id: G-M5, label: "Freeze Stock configuration without activation", plain_language_scope: "Bind AAPL identity, oracle, vault, caps, routes, assertions, monitoring, and a disabled configuration package.", why_it_matters: "Integrated M1-M4 proof does not choose production values or make Stock reachable safely.", state: "open", effect: "Blocks Stock reachability, deployment, activation, and release; parked policy work remains nonblocking."}
  - { id: G-H04-BINDING, label: "Resolve deployment binding readiness", plain_language_scope: "Verify external facts and bind deployment-produced identities, TrainingWheels, and required non-Deleverage machine inputs before any deployment use.", why_it_matters: "A compiling, synchronized configuration does not make unresolved inputs deployable.", state: "open", effect: "Blocks H-05 release-candidate planning, deployment configuration, deployment, activation, and release; it does not block local source/ledger consistency checks."}
  - { id: G-CURVE-INPUTS, label: "Close bounded Curve launch inputs", plain_language_scope: "Verify five official provider and binding identities; bind the deployment-produced pool address, slippage limit, minimum retained liquidity, and production observation before ID-2 deployment use.", why_it_matters: "Repository candidates and official source provenance are not target-chain verification, pool deployment, or an operating observation.", state: "open", effect: "Blocks Curve deployment, ID-2 registration, GREEN feed activation, migration readiness, and release; it does not block offline source, generator, or test validation."}
  - { id: G-DELEVERAGE-PARAMS, label: "Preserve deferred Deleverage controls", plain_language_scope: "Keep fullPayoffBuffer, overageBps, dustThreshold, and dustBps at zero; RH-D038 reopens only the exact SC-07/SC-09 source and evidence work, not representation, configuration, fork, deployment, or operational work.", why_it_matters: "The integrated contracts expose the controls, but the owner has deferred their configuration and every broader Deleverage task.", state: "parked_nonblocking_except_exact_rh_d038_candidate", effect: "Does not block current non-Deleverage launch preparation or RH-D038's bounded candidate; further reopening requires explicit owner instruction."}
  - { id: G-H05-READINESS, label: "Promote deterministic planning after bindings", plain_language_scope: "Rebuild the integrated deterministic reports only after required bindings exist, preserving typed blocked and non-executable rows.", why_it_matters: "Planning code must not turn missing inputs or reservations into transactions.", state: "open", effect: "Blocks an executable release-candidate plan and later deployment evidence; migration execution remains separately unauthorized."}
  - { id: G-H06-OPS, label: "Qualify intended manifest operator and storage", plain_language_scope: "Repeat exact macOS/APFS qualification for the intended operator, device, filesystem, and runbook.", why_it_matters: "Integrated implementation evidence is not operational publication or release qualification.", state: "open", effect: "Blocks operational publication, deployment evidence, and release."}
  - { id: G-T1-CCIP, label: "CCIP live operational disposition", plain_language_scope: "Preserve the confirmed live topology while the owner selects rate-limit and rateLimitAdmin policy, accepted full OffRamp destination-gas evidence is produced, and exact live identity, license, and transaction provenance gaps are closed or explicitly accepted.", why_it_matters: "Live mint authority and cross-chain routing require explicit operating controls; current state must not be mistaken for policy, source-equivalence, or legal approval.", state: "open", effect: "Blocks an operational-readiness or release claim and any inferred policy, source equivalence, license conclusion, or tooling backend; it does not authorize or apply a live change."}
  - { id: G-SECOPS, label: "Freeze operational authorities and monitoring", plain_language_scope: "Approve signer policy, roles, capability handoff, monitoring, escalation, kill procedures, and operators.", why_it_matters: "Privileged capabilities and incidents require explicit ownership before live handoff.", state: "open", effect: "Blocks testnet, production, activation, and release."}
  - { id: G-TESTNET, label: "Authorize an exact testnet rehearsal", plain_language_scope: "Name the exact plan, network, provider, accounts, funds, roles, commands, evidence, and stops.", why_it_matters: "Testnet mutates external state and cannot be inferred from local validation.", state: "open", effect: "Blocks testnet deployment, configuration, funding, signing, and broadcasts."}
  - { id: G-PROD, label: "Authorize restricted production deployment and release", plain_language_scope: "Approve the exact production plan, authorities, artifacts, configuration, monitoring, activation, and release sequence.", why_it_matters: "Production affects real users and assets and has no implied authority from earlier phases.", state: "open", effect: "Blocks production deployment, migration, registration, role transfer, configuration, activation, and release."}

