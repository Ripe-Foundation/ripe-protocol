owner_priority_overlay:
  effective_at: "2026-08-01"
  authority: Explicit owner directive
  scope: >
    This overlay controls current prioritization, blocker treatment, and agent
    assignments. It does not rewrite historical evidence, close a technical
    blocker, change integrated source, or authorize deployment or release.
  active_focus: >
    The deployment owner may continue bounded launch preparation now: bind final
    non-Deleverage inputs, preserve fail-closed unresolved state, build
    deterministic artifacts, qualify the intended operator, and prepare later
    rehearsal and release packets without executing a migration or touching
    live state.
  parked_lanes:
    - id: PARK-CCIP
      subject: all CCIP workflows
      state: parked_nonblocking
      blocker_effect: nonblocking
      instruction: >
        Do not perform CCIP research, implementation, review, coordination,
        packaging, testnet, deployment, promotion, or status work. Keep CCIP
        disabled. Historical CCIP records remain preserved but are not an
        active dependency or blocker for current non-CCIP work.
      reopen_condition: Explicit owner instruction.
    - id: PARK-ZERO-BACKING-POLICY
      subject: CreditEngine zero-backing reassessment, settlement, and bad-debt policy
      state: parked_nonblocking
      blocker_effect: nonblocking
      instruction: >
        Preserve the integrated M2/M3 source and regression behavior, but do
        not reassess CreditEngine zero backing or design, remediate, review, or
        schedule zero-backing settlement or bad-debt policy work. The parked
        residual is not an active blocker for current planning, parameter,
        tooling, or non-policy proof work.
      reopen_condition: Explicit owner instruction.
    - id: PARK-DELEVERAGE
      subject: every Deleverage task
      state: parked_nonblocking
      blocker_effect: nonblocking
      instruction: >
        Preserve the historical zero-cooldown decision, integrated PR #61
        bytes, and four zero-valued controls. Do not perform contract,
        interface, ABI, parameter, configuration, test, fork, documentation,
        size/headroom, deployment, or operational work. Do not implement the
        provisional H-09 Deleverage path.
      reopen_condition: Explicit owner instruction plus H-09 ceiling reseal for any fork-suite work.
    - id: PARK-UNISWAP-TWAP
      subject: Uniswap TWAP admission and activation
      state: parked_nonblocking
      blocker_effect: nonblocking
      instruction: >
        The archival RobinhoodUniswapV2RipePrices research/monitoring prototype
        source is present in the repository but remains unregistered,
        unconfigured, non-admitted, undeployed, unactivated, and unavailable
        for protocol accounting. Do not add a checkpoint service, PriceDesk
        registration, Chainlink fallback, pool address, liquidity amount,
        funding or custody authority, migration, deployment-plan dependency,
        configuration, admission, deployment, or activation. No Uniswap launch
        price source is required; the PriceDesk priority source IDs [1, 3]
        remain unchanged. An optional externally held RIPE/WETH V2
        liquidity canary remains operational preparation, not protocol oracle
        authority.
      reopen_condition: Approved security-relevant RIPE-price consumer plus separate owner, risk, security, custody, and exposure decisions.
    - id: PARK-SITES-RECOVERY
      subject: Sites account and workspace recovery
      state: parked_nonblocking
      blocker_effect: nonblocking
      instruction: >
        Preserve the retained project identity and prior account-mismatch
        evidence. Do not recover access, create a replacement project, or
        change access while deployment preparation proceeds locally.
      reopen_condition: Explicit owner instruction from the owning account or workspace.
    - id: PARK-DASHBOARD-DEPLOYMENT
      subject: dashboard deployment and access changes
      state: parked_nonblocking
      blocker_effect: nonblocking
      instruction: >
        Validate the dashboard locally only. Do not save a Sites version,
        deploy, publish, or change access as part of deployment preparation.
      reopen_condition: Separate dashboard publication authority after an exact committed source exists.
  preserved_boundaries:
    - Parking does not declare any residual safe, resolved, approved, or closed.
    - Parking does not authorize Stock reachability, configuration, activation, deployment, or release.
    - Historical evidence and blocker identifiers remain intact for later re-entry.
    - "Corrected PR #61 integration does not authorize deployment, migration execution, configuration, activation, or release."
    - The provisional 33-path H-09 census ceiling is planning-only and must be resealed without a Deleverage lane unless that parked work is explicitly reopened.

deployment_owner:
  readiness: "Ready to begin deployment preparation."
  authority_boundary: >
    The coworker owns preparation, qualification, rehearsal, and packet
    assembly. Testnet actions and eventual production deployment remain
    separately authorized external-state phases.
  sequence:
    - order: 1
      label: Bind final chain and protocol inputs
      owns: Final Robinhood chain, token, asset, pool, contract-address, and approved parameter bindings.
      output: A complete reviewed binding register with unresolved values still explicit.
      boundary: Do not invent, substitute, configure, or activate a value.
    - order: 2
      label: Bind authorities and operators
      owns: Governance, signer, role, TrainingWheels, lite-signer, emergency, and operator assignments.
      output: A reviewed authority map and signer-ceremony input set.
      boundary: No account, key, signer, RPC, role transfer, or live permission action.
    - order: 3
      label: Honor consolidated scope and deferrals
      owns: Keep bounded launch preparation inside the synthesis and exclude every deferred lane and Curve higher power.
      output: A dependency register that leaves CreditEngine zero-backing, Deleverage, Uniswap TWAP, CCIP, Sites, and live execution unopened.
      boundary: Preserve the four Deleverage values at zero without creating representation or size/headroom work.
    - order: 4
      label: Maintain and synchronize source-authoritative DefaultsRobinhood
      owns: Owner-edited Defaults getters plus deterministic derived-ledger synchronization.
      output: Compiling source-authoritative defaults, a synchronized derived ledger, and fail-closed parity evidence.
      boundary: Configuration consistency does not resolve deployment bindings or authorize configuration, deployment, or activation.
    - order: 5
      label: Finalize deterministic migration and release planning
      owns: Executable deterministic migration and release planning.
      output: Exact reviewed plans, assertions, stops, and isolated Robinhood history interfaces.
      boundary: H-05 remains predeployment planning; no migration execution or history promotion.
    - order: 6
      label: Bind H-06 to the intended environment
      owns: Final H-06 operator, machine, and volume binding.
      output: Exact macOS/APFS operator and storage qualification for the frozen release candidate.
      boundary: Candidate-class qualification is not final operational or release authority.
    - order: 7
      label: Freeze deterministic deployment artifacts
      owns: Deterministic deployment artifacts and offline verification interfaces.
      output: Exact bytecode, constructor, ABI, verifier, manifest, and offline proof package.
      boundary: No live verification submission, RPC use, deployment, or configuration.
    - order: 8
      label: Rehearse on testnet and capture evidence
      owns: Testnet rehearsal and evidence capture.
      output: Reproducible rehearsal evidence, failure records, and post-state assertions.
      boundary: Execute only under a later exact testnet authorization.
    - order: 9
      label: Complete security-operations readiness
      owns: Monitoring, escalation, pause, emergency, incident, and accountable-operator readiness.
      output: Approved SecOps handoff with tested kill and escalation procedures.
      boundary: Readiness evidence does not transfer a role or activate the protocol.
    - order: 10
      label: Assemble and execute the restricted release
      owns: Production packet, rollback and abort criteria, signer ceremony, and eventual deployment execution.
      output: Independently reviewed release packet and, only later, an authorized deployment record.
      boundary: Production execution requires separate exact authorization; this handoff grants none.
  parallel_inputs:
    - name: Consolidated smart-contract reassessment corpus
      start_effect: integrated_documentation_input
      gate_effect: Consume the synthesis's Ledger, Teller, historical GuardedErc20, and Uniswap conclusions before affected work closes; the BasicVault decision supersedes the historical separate-vault recommendation.
    - name: Consolidated fork and external-integration qualification corpus
      start_effect: integrated_documentation_input
      gate_effect: Consume the synthesis's bounded launch Curve route, follow-on higher-power and LP, PSM, network, oracle, H-09/H-10, and external-input gates before affected work closes.

