schema_version: 2
as_of: 2026-08-15
integrated_target:
  branch: rh-audit-remediation
  highest_decision_id: RH-D036
reservation_scope: identifiers_only_titles_are_coordination_hints
recent_integrated_register_entries:
  - { pr: 142, ids: [RH-D033, RH-D034] }
  - { pr: 144, ids: [RH-D035] }
  - { pr: 143, ids: [RH-D036] }
current_candidate_register_entries:
  - { pr: 152, ids: [RH-D042] }
open_pr_reservations:
  - { pr: 146, id: RH-D037, title: "CreditEngine repayment-liveness and stale-vault exact waiver at 21 bytes" }
  - { pr: 145, id: RH-D038, title: "SC-07/SC-09 Deleverage remediation is reopened and bounded" }
  - { pr: 147, id: RH-D039, title: "Endaoment value conservation and StableSwap-NG boundary are exact" }
  - { pr: 147, id: RH-D040, title: "Endaoment stabilizer execution is quote-bound" }
  - { pr: 147, id: RH-D041, title: "Endaoment cap-binding keeper gas budget is five million" }
lifecycle:
  reserved: >-
    An open PR owns only its reserved identifier. Reservation titles are
    descriptive coordination hints, not cross-branch authority. Once a
    candidate carries an entry, exact title parity is enforced between its
    decision register and status row.
  current_candidate: >-
    A PR that already carries its decision in the register and status moves
    from open_pr_reservations to current_candidate_register_entries. Candidate
    entries are not integrated authority.
  on_merge: >-
    After target integration, remove the PR from current-candidate state, add
    it to recent_integrated_register_entries, and advance highest_decision_id
    in the first target-bound ledger update.
  stale_branch: >-
    Any open PR whose documents use a different identifier must rebase and
    adopt its reserved ID before integration. PR 145 currently must replace
    RH-D033 with reserved RH-D038 when rebased.
