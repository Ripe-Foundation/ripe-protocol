[pytest]
testpaths = tests
pythonpath =
    .
    tests
markers =
    release: manual deployment/release evidence and status assertions, excluded from ordinary PR CI
    artifact: static source, ABI, artifact, or inventory identity, excluded from ordinary PR CI
    fuzz: comprehensive property-based campaigns
    gas: gas benchmark evidence
    fork_qualification: explicit fork-qualification evidence
    serial: test must not run concurrently with other tests
addopts =
    -p no:unraisableexception
    --ignore=tests/deployment
    -m "not release and not artifact and not fuzz and not gas and not fork_qualification"
